services:
  api:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./src:/usr/src/app/src
      - api-logs:/usr/src/app/logs
      - ./data:/usr/src/app/data
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATA_PATH=/usr/src/app/data/tasks.json
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data   # Persistance BDD
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  postgres-data: 
  api-logs: