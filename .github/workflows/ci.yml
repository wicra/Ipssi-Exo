name: Todo API CI/CD

on:
  push:
    branches: [ "projet-docker" ]
  pull_request:
    branches: [ "projet-docker" ]

jobs:
  # ─── PHASE 1 : Tests unitaires ───────────────────────────────────────────────
  test-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./SERGIO_WICRAMACHINE_TODO_API
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './SERGIO_WICRAMACHINE_TODO_API/package-lock.json'

      - name: Installation des dépendances
        run: npm ci

      - name: Lancement des tests unitaires
        run: npm run test

  # ─── PHASE 2 : Tests d'intégration avec PostgreSQL ──────────────────────────
  test-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./SERGIO_WICRAMACHINE_TODO_API
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: todo_test
          POSTGRES_USER: todo_user
          POSTGRES_PASSWORD: todo_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './SERGIO_WICRAMACHINE_TODO_API/package-lock.json'

      - name: Installation des dépendances
        run: npm ci

      - name: Lancement des tests avec Base de Données
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: todo_test
          DB_USER: todo_user
          DB_PASSWORD: todo_pass
        run: npm run test

  # ─── PHASE 3 : Build et push de l'image Docker ───────────────────────────────
  build-and-push:
    needs: [test-unit, test-integration]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/projet-docker'
    defaults:
      run:
        working-directory: ./SERGIO_WICRAMACHINE_TODO_API
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build de l'image Docker
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USER }}/todo-api:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USER }}/todo-api:latest .

      - name: Push des deux tags sur DockerHub
        run: |
          docker push ${{ secrets.DOCKERHUB_USER }}/todo-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USER }}/todo-api:latest

  # ─── PHASE 4 : Déploiement sur K3S ───────────────────────────────────────────
  deploy-k3s:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/projet-docker'
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer kubectl avec le kubeconfig du cluster
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Mettre à jour l'image du deployment (rolling update)
        run: |
          kubectl set image deployment/todo-api \
            todo-api=${{ secrets.DOCKERHUB_USER }}/todo-api:${{ github.sha }}

      - name: Attendre la fin du rolling update
        run: kubectl rollout status deployment/todo-api --timeout=120s
